file_uploads = On
memory_limit = 500M
upload_max_filesize = 500M
post_max_size = 500M
max_execution_time = 600

; Sécurité : ne pas exposer la version PHP via l'en-tête X-Powered-By
; (fuite d'info facilitant le fingerprinting/ciblage de CVE, cf. audit sécu juillet 2026)
expose_php = Off

; Sécurité : la progression d'upload par session est le chemin d'exploitation confirmé de
; CVE-2026-109619 (PHP2Shell, octobre 2026). WordPress ne s'en sert pas : coupée par défaut,
; elle reste une surface en moins même une fois PHP corrigé.
session.upload_progress.enabled = 0
