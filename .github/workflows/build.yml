name: Build & Push

on:
  # Deploiement sur tag de version uniquement, jamais sur un push de branche : pousser un
  # correctif de documentation ou une experimentation sur main ne doit pas partir en production.
  # Poser un tag vX.Y.Z pour livrer. Volontairement sans filtre de chemin : GitHub combine
  # (branches/tags) ET paths, ce qui rend le declencheur sur tag imprevisible des qu'un filtre
  # de chemin est present.
  push:
    tags: ['v*.*.*']
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if wordpress:latest changed
        id: check
        run: |
          docker pull wordpress:latest
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' wordpress:latest)
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          if [ "${{ github.event_name }}" = "schedule" ]; then
            CACHED=$(cat .wordpress-digest 2>/dev/null || echo "none")
            if [ "$DIGEST" = "$CACHED" ]; then
              echo "skip=true" >> $GITHUB_OUTPUT
            else
              echo "skip=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Build & push
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/painteau/wordpress:latest
            ghcr.io/painteau/wordpress:${{ github.sha }}

      - name: Save digest for next scheduled run
        if: steps.check.outputs.skip != 'true'
        run: |
          echo "${{ steps.check.outputs.digest }}" > .wordpress-digest
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .wordpress-digest
          git diff --cached --quiet && exit 0
          git commit -m "chore: update cached wordpress:latest digest [skip ci]"
          git push
